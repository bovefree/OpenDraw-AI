# Native OpenDraw AI identity builds; experimental and unsigned.
# These builds add an independent application name, original generated mark and isolated preferences.
name: OpenDraw Alpha 3 Corel desktop preview

on:
  pull_request:
    paths:
      - '.github/workflows/opendraw-branded-preview.yml'
      - 'apps/vectorcraft/**'
      - 'crates/ui-egui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - run: cargo fmt --all -- --check

  windows:
    name: Windows x64 OpenDraw AI Alpha 3
    runs-on: windows-latest
    timeout-minutes: 120
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Build native OpenDraw application
        run: cargo build --release --locked -p vectorcraft --features opendraw
      - name: Check isolated profile
        run: cargo test --locked -p vectorcraft --features opendraw opendraw_profile_is_separate_from_upstream_on_both_desktops
      - name: Package portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist/OpenDrawAI-windows-x64' | Out-Null
          Copy-Item 'target/release/vectorcraft.exe' 'dist/OpenDrawAI-windows-x64/OpenDrawAI.exe'
          foreach ($file in @('LICENSE-MIT','LICENSE-APACHE','NOTICE')) {
            if (Test-Path $file) { Copy-Item $file 'dist/OpenDrawAI-windows-x64/' }
          }
          'OpenDraw AI Alpha 3 Corel-layout portable preview - unsigned test build. The original editable format remains .vectorcraft. CDR import is NOT available. Use copies of your files.' |
            Set-Content -Encoding UTF8 'dist/OpenDrawAI-windows-x64/READ_FIRST.txt'
          Compress-Archive -Path 'dist/OpenDrawAI-windows-x64/*' -DestinationPath 'dist/OpenDrawAI-windows-x64-alpha3.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDrawAI-windows-x64-alpha3
          path: dist/OpenDrawAI-windows-x64-alpha3.zip
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon OpenDraw AI Alpha 3
    runs-on: macos-15
    timeout-minutes: 120
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: opendraw-macos-arm64
      - name: Build Apple Silicon executable
        run: cargo build --release --locked -p vectorcraft --features opendraw --target aarch64-apple-darwin
      - name: Package unsigned testing app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/OpenDraw AI.app"
          mkdir -p "$APP/Contents/MacOS" "dist/stage"
          cp target/aarch64-apple-darwin/release/vectorcraft "$APP/Contents/MacOS/OpenDrawAI"
          chmod +x "$APP/Contents/MacOS/OpenDrawAI"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>org.opendraw.ai.preview</string>
            <key>CFBundleName</key><string>OpenDraw AI</string>
            <key>CFBundleDisplayName</key><string>OpenDraw AI</string>
            <key>CFBundleExecutable</key><string>OpenDrawAI</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.3.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --sign - --options runtime "$APP"
          codesign --verify --strict --deep "$APP"
          ditto "$APP" "dist/stage/OpenDraw AI.app"
          cp LICENSE-MIT LICENSE-APACHE dist/stage/
          printf '%s\n' 'OpenDraw AI Alpha 3: ad-hoc signed, NOT Apple-notarized. For local testing only. Use document copies, not originals.' 'CDR import is NOT supported.' > dist/stage/READ_FIRST.txt
          ditto -c -k --keepParent dist/stage dist/OpenDrawAI-macos-arm64-alpha3.zip
          lipo -info "$APP/Contents/MacOS/OpenDrawAI"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDrawAI-macos-arm64-alpha3
          path: dist/OpenDrawAI-macos-arm64-alpha3.zip
          retention-days: 14
          if-no-files-found: error
