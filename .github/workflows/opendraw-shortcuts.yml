name: OpenDraw Corel-style shortcuts

on:
  pull_request:
    paths:
      - '.github/workflows/opendraw-shortcuts.yml'
      - 'crates/ui-egui/src/shortcut_editor.rs'
      - 'crates/ui-egui/src/state.rs'
      - 'docs/opendraw/SHORTCUTS.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shortcut-tests:
    name: OpenDraw shortcut regressions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test OpenDraw Corel-style keys and conflicts
        run: cargo test --locked -p vectorcraft-ui-egui --features opendraw corel_style_shortcuts_activate_tools_without_panel_conflicts --lib
      - name: Ensure upstream default preset unchanged
        run: cargo test --locked -p vectorcraft-ui-egui presets_are_the_defaults --lib
